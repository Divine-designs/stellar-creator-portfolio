# CI workflow: ci
# Purpose: Main CI matrix — runs frontend lint/typecheck/unit-tests/build,
# Prisma migration health, Rust backend clippy+tests, reproducible WASM
# contract hash verification, Lighthouse performance audit, Playwright E2E
# tests, and a Docker image smoke-test on every push/PR to main or dev.
# Caching: pnpm store (actions/setup-node cache:'pnpm') and Cargo registry
# + target directory (Swatinem/rust-cache) are restored on every run.
name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: i18n key parity (web + mobile locales)
        run: pnpm run i18n:check
      - name: Route auth declarations
        run: pnpm exec tsx scripts/check-route-auth.ts
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-build-${{ github.sha }}
          path: .next/
          if-no-files-found: error

  migration-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check no duplicate migration prefixes
        run: |
          cd backend/migrations
          duplicates=$(ls *.sql 2>/dev/null | sed 's/_.*//' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate migration prefixes found: $duplicates"
            exit 1
          fi
          echo "Migration prefixes are unique"

  prisma-migrations:
    name: Prisma migrations apply to an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply all migrations
        run: pnpm exec prisma migrate deploy
      - name: Fail if the schema has tables or columns no migration creates
        run: |
          pnpm exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > drift.sql
          if grep -qE 'CREATE TABLE|ADD COLUMN|CREATE TYPE' drift.sql; then
            echo "schema.prisma declares objects that no migration creates:"
            grep -E 'CREATE TABLE|ADD COLUMN|CREATE TYPE' drift.sql
            exit 1
          fi

  integration-tests:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/test_db
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Run Integration Tests
        run: pnpm run test:integration

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: No unwrap/panic in contract code
        run: ./scripts/check-contract-panics.sh
      - name: Clippy
        run: cd backend && cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cd backend && cargo test --workspace --all-features
      - name: Contract resource benchmarks
        # Emits ::warning:: annotations for entrypoints >10% over
        # backend/contracts/benchmarks.json without failing the job.
        run: cd backend && cargo test -p contract-benchmarks -- --nocapture

  contract-bindings:
    name: Contract TypeScript Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Regenerate bindings
        run: ./scripts/generate-contract-bindings.sh
      - name: Fail if committed bindings are stale
        run: |
          if [ -n "$(git status --porcelain -- packages/contracts-ts)" ]; then
            git status --short -- packages/contracts-ts
            git diff -- packages/contracts-ts | head -200
            echo "::error::packages/contracts-ts is out of date. Run ./scripts/generate-contract-bindings.sh and commit the result."
            exit 1
          fi
      - name: Type-check bindings
        run: pnpm exec tsc -p packages/contracts-ts

  reproducible-build:
    name: Verify Reproducible Contract Hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build & verify hashes
        run: ./scripts/verify.sh
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: soroban-contracts-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build-${{ github.sha }}
          path: .next/
      - name: Run Lighthouse CI
        run: |
          pnpm exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Comment PR with Lighthouse scores
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const resultsPath = '.lighthouseci';
            if (!fs.existsSync(resultsPath)) return;
            const files = fs.readdirSync(resultsPath).filter(f => f.endsWith('.json') && f.startsWith('lhr-'));
            if (files.length === 0) return;

            let body = '## Lighthouse CI Results\n\n| URL | Performance | Accessibility | Best Practices | SEO |\n|-----|------------|---------------|----------------|-----|\n';

            for (const file of files) {
              const data = JSON.parse(fs.readFileSync(`${resultsPath}/${file}`, 'utf8'));
              const url = data.finalUrl || data.requestedUrl || file;
              const score = (cat) => {
                const v = data.categories?.[cat]?.score;
                return v == null ? 'n/a' : Math.round(v * 100);
              };
              body += `| ${url} | ${score('performance')} | ${score('accessibility')} | ${score('best-practices')} | ${score('seo')} |\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
